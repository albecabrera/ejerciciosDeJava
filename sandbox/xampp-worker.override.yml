services:
  java-sandbox-worker:
    image: eclipse-temurin:21-jdk
    container_name: java-werkstatt-sandbox-worker
    network_mode: none
    read_only: true
    user: "33:33"
    command: ["java", "/opt/java-werkstatt/Worker.java"]
    environment:
      JAVA_WORKER_QUEUE: /var/lib/java-werkstatt/queue
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - ${JAVA_WERKSTATT_ROOT}/sandbox/Worker.java:/opt/java-werkstatt/Worker.java:ro
      - ${JAVA_WORKER_QUEUE_HOST}:/var/lib/java-werkstatt/queue
    cpus: 0.50
    mem_limit: 192m
    pids_limit: 80
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
