services:
  java-sandbox-worker:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    container_name: java-werkstatt-sandbox-worker
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - java-werkstatt-queue:/var/lib/java-werkstatt/queue
    cpus: 0.50
    mem_limit: 128m
    pids_limit: 80
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  java-werkstatt-queue:
